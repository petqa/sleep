log-level: warning
allow-lan: true
ipv6: true
mode: rule
# Proxy Mode: MIXED (TCP via TPROXY port 7894, UDP via TUN)
tproxy-port: 7894
tun:
  enable: true
  device: clash-tun
  stack: system
  auto-route: false
  auto-redirect: false
  auto-detect-interface: true
unified-delay: true
tcp-concurrent: true
disable-keep-alive: false
keep-alive-idle: 600
keep-alive-interval: 15
find-process-mode: off
geodata-mode: false
geo-auto-update: false
global-client-fingerprint: chrome
global-ua: clash.meta
external-controller: 0.0.0.0:9090
external-controller-cors:
  allow-origins:
    - "*"
  allow-private-network: true
external-ui: ui
external-ui-url: "https://github.com/MetaCubeX/metacubexd/releases/latest/download/compressed-dist.tgz"
profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: true
  force-dns-mapping: false
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443]
  skip-dst-address:
    - 224.0.0.0/3
    - 10.0.0.0/8
    - 127.0.0.0/8
    - 100.64.0.0/10
    - 172.16.0.0/12
    - 198.18.0.0/15
    - 169.254.0.0/16
    - 192.168.0.0/16
    - 192.0.0.0/24
    - 192.0.2.0/24
    - 192.88.99.0/24
    - 198.51.100.0/24
    - 203.0.113.0/24
    - fc00::/7
    - ff00::/8
    - fe80::/10
    - ::/127

anchors:
  a1: &domain { type: http, format: mrs, behavior: domain, interval: 86400, proxy: DIRECT }
  a2: &ipcidr { type: http, format: mrs, behavior: ipcidr, interval: 86400, proxy: DIRECT }
  a3: &classical { type: http, format: text, behavior: classical, interval: 86400, proxy: DIRECT }
  a4: &inline { type: inline, behavior: classical }

dns:
  enable: false

proxy-providers:
  pqsubscribe:
    type: http
    url: https://url
    interval: 3600
    proxy: DIRECT
    health-check:
      enable: true
      url: http://cp.cloudflare.com/generate_204
      expected-status: 204
      interval: 120
      timeout: 3000
      lazy: false

proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - BALANCE
      - BEST
      - MANUAL

  - name: BALANCE
    type: load-balance
    use:
      - pqsubscribe
    strategy: consistent-hashing
    url: http://cp.cloudflare.com/generate_204
    expected-status: 204
    interval: 120
    timeout: 3000
    tolerance: 200
    lazy: false

  - name: BEST
    type: url-test
    use:
      - pqsubscribe
    url: http://cp.cloudflare.com/generate_204
    expected-status: 204
    interval: 120
    timeout: 3000
    tolerance: 200
    lazy: false

  - name: MANUAL
    type: select
    use:
      - pqsubscribe

  - name: QUIC
    type: select
    hidden: true
    proxies:
      - REJECT
      - PASS

rule-providers:
  cdn-ip-ranges-all:
    behavior: ipcidr
    type: http
    url: "https://raw.githubusercontent.com/123jjck/cdn-ip-ranges/refs/heads/main/all/all_plain.txt"
    interval: 86400
    format: text
    proxy: DIRECT

  # ── Приватные сети ──
  geosite-private: { <<: *domain, url: https://github.com/MetaCubeX/meta-rules-dat/raw/meta/geo/geosite/private.mrs }
  geoip-private: { <<: *ipcidr, url: https://github.com/MetaCubeX/meta-rules-dat/raw/meta/geo/geoip/private.mrs }

  # ── Сервисы ──
  category-ai@domain: { <<: *domain, url: https://github.com/MetaCubeX/meta-rules-dat/raw/meta/geo/geosite/category-ai-!cn.mrs }
  discord@classical: { <<: *classical, url: https://github.com/zxc-rv/assets/raw/main/rules/discord.list }
  google@domain: { <<: *domain, url: https://github.com/MetaCubeX/meta-rules-dat/raw/meta/geo/geosite/google.mrs }
  github@domain: { <<: *domain, url: https://github.com/MetaCubeX/meta-rules-dat/raw/meta/geo/geosite/github.mrs }
  meta@domain: { <<: *domain, url: https://github.com/MetaCubeX/meta-rules-dat/raw/meta/geo/geosite/facebook.mrs }
  meta@ipcidr: { <<: *ipcidr, url: https://github.com/MetaCubeX/meta-rules-dat/raw/meta/geo/geoip/facebook.mrs }
  reddit@domain: { <<: *domain, url: https://github.com/MetaCubeX/meta-rules-dat/raw/meta/geo/geosite/reddit.mrs }
  spotify@domain: { <<: *domain, url: https://github.com/MetaCubeX/meta-rules-dat/raw/meta/geo/geosite/spotify.mrs }
  steam@domain: { <<: *domain, url: https://github.com/MetaCubeX/meta-rules-dat/raw/meta/geo/geosite/steam.mrs }
  telegram@domain: { <<: *domain, url: https://github.com/MetaCubeX/meta-rules-dat/raw/meta/geo/geosite/telegram.mrs }
  telegram@ipcidr: { <<: *ipcidr, url: https://github.com/MetaCubeX/meta-rules-dat/raw/meta/geo/geoip/telegram.mrs }
  twitch@domain: { <<: *domain, url: https://github.com/MetaCubeX/meta-rules-dat/raw/meta/geo/geosite/twitch.mrs }
  twitter@domain: { <<: *domain, url: https://github.com/MetaCubeX/meta-rules-dat/raw/meta/geo/geosite/twitter.mrs }
  youtube@domain: { <<: *domain, url: https://github.com/MetaCubeX/meta-rules-dat/raw/meta/geo/geosite/youtube.mrs }
  gemini@domain: { <<: *domain, url: https://github.com/MetaCubeX/meta-rules-dat/raw/meta/geo/geosite/google-gemini.mrs }

  # ── CDN / Cloud провайдеры ──
  amazon@domain: { <<: *domain, url: https://github.com/MetaCubeX/meta-rules-dat/raw/meta/geo/geosite/amazon.mrs }
  akamai@domain: { <<: *domain, url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/akamai.mrs }
  cloudflare@domain: { <<: *domain, url: https://github.com/MetaCubeX/meta-rules-dat/raw/meta/geo/geosite/cloudflare.mrs }
  digitalocean@domain: { <<: *domain, url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/digitalocean.mrs }
  fastly@domain: { <<: *domain, url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/fastly.mrs }
  hetzner@domain: { <<: *domain, url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/hetzner.mrs }
  oracle@domain: { <<: *domain, url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/oracle.mrs }

  # ── RU-специфика ──
  refilter@domain: { <<: *domain, url: https://github.com/legiz-ru/mihomo-rule-sets/raw/main/re-filter/domain-rule.mrs }
  rubundle@domain: { <<: *domain, url: https://github.com/legiz-ru/mihomo-rule-sets/raw/main/ru-bundle/rule.mrs }
  legizdiscord@ipcidr: { <<: *ipcidr, url: https://github.com/legiz-ru/mihomo-rule-sets/raw/main/other/discord-voice-ip-list.mrs }

  # ── Пользовательские правила (inline) ──
  user@classical: # СВОИ ПРАВИЛА
    type: inline
    behavior: classical
    payload:
      - DOMAIN-SUFFIX,2ip.io
      - DOMAIN-SUFFIX,habr.com
      - DOMAIN-SUFFIX,coinbase.com
      - DOMAIN-KEYWORD,trae
      - DOMAIN-KEYWORD,fellow
      - DOMAIN-KEYWORD,docker
      - DOMAIN-KEYWORD,discord
      - DOMAIN-KEYWORD,redhat
      - DOMAIN-KEYWORD,openshift
      - DOMAIN-KEYWORD,wago
      - DOMAIN-KEYWORD,bybit
      - DOMAIN-KEYWORD,ijustvibecodedthis
      - DOMAIN-KEYWORD,intercomcdn
      - DOMAIN-KEYWORD,stripe
      - DOMAIN-KEYWORD,cline
      - DOMAIN-KEYWORD,cwallet
      - DOMAIN-KEYWORD,groq
      - DOMAIN-KEYWORD,volcengine
      - DOMAIN-KEYWORD,ishosting
      - DOMAIN-KEYWORD,inferno
      - DOMAIN-KEYWORD,questionablyepic
      - DOMAIN-KEYWORD,bloodmallet
      - DOMAIN-KEYWORD,bentoml
      - DOMAIN-KEYWORD,datacamp
      - DOMAIN-KEYWORD,context7
      - DOMAIN-KEYWORD,universe
      - DOMAIN-KEYWORD,play2go
      - DOMAIN-KEYWORD,visualstudio

sub-rules:
  selective-direct:
    - OR,((RULE-SET,geosite-private),(RULE-SET,geoip-private,no-resolve)),DIRECT
    - DOMAIN-SUFFIX,su,DIRECT
    - DOMAIN-SUFFIX,ru,DIRECT
    - MATCH,PROXY

rules:
  - SUB-RULE,(SRC-IP-CIDR,10.0.100.114/32),selective-direct
  - SUB-RULE,(SRC-IP-CIDR,10.0.100.109/32),selective-direct

  # ── Приватные сети → DIRECT ──
  - OR,((RULE-SET,geosite-private),(RULE-SET,geoip-private,no-resolve)),DIRECT

  # ── IPv6 → REJECT-DROP (остальной вне fake-ip) ──
  - IP-CIDR6,::/0,REJECT-DROP,no-resolve

  # ── QUIC блокировка ──
  - AND,((NETWORK,UDP),(DST-PORT,443)),QUIC

  # ── Свои домены → DIRECT
  - DOMAIN-SUFFIX,checker.petqa.ru,PROXY
  - DOMAIN-SUFFIX,petqa.ru,DIRECT
  - DOMAIN-SUFFIX,cp.cloudflare.com,DIRECT
  - DOMAIN-SUFFIX,pally.info,DIRECT

  # ── Сервисы → PROXY ──
  - RULE-SET,cdn-ip-ranges-all,PROXY,no-resolve
  - RULE-SET,category-ai@domain,PROXY
  - RULE-SET,gemini@domain,PROXY
  - RULE-SET,steam@domain,PROXY
  - RULE-SET,spotify@domain,PROXY
  - RULE-SET,reddit@domain,PROXY
  - RULE-SET,youtube@domain,PROXY
  - RULE-SET,twitch@domain,PROXY
  - RULE-SET,twitter@domain,PROXY
  - RULE-SET,discord@classical,PROXY
  - OR,((RULE-SET,meta@domain),(RULE-SET,meta@ipcidr,no-resolve)),PROXY
  - OR,((RULE-SET,telegram@domain),(RULE-SET,telegram@ipcidr,no-resolve)),PROXY

  # ── CDN / Cloud → PROXY ──
  - RULE-SET,cloudflare@domain,PROXY
  - RULE-SET,amazon@domain,PROXY
  - RULE-SET,akamai@domain,PROXY
  - RULE-SET,digitalocean@domain,PROXY
  - RULE-SET,fastly@domain,PROXY
  - RULE-SET,hetzner@domain,PROXY
  - RULE-SET,oracle@domain,PROXY

  # ── RU-фильтры → PROXY ──
  - RULE-SET,refilter@domain,PROXY
  - RULE-SET,rubundle@domain,PROXY
  - RULE-SET,legizdiscord@ipcidr,PROXY,no-resolve

  # ── Пользовательские → PROXY ──
  - RULE-SET,user@classical,PROXY

  # ── Google/GitHub ──
  - RULE-SET,google@domain,PROXY
  - RULE-SET,github@domain,PROXY

  # ── Всё остальное ──
  - MATCH,DIRECT
