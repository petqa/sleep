### ═══════════════════════════════════════════════
###  MIHOMO — ФИНАЛЬНЫЙ КОНФИГ (РОУТЕР)
###  Защита от бага "все серверы мертвы":
###    • BALANCE/BEST содержат DIRECT как fallback
###    • health-check: lazy: false, interval: 120
###    • tolerance: 200 — не дёргаться при кратких сбоях
### ═══════════════════════════════════════════════

log-level: warning
allow-lan: true
redir-port: 5000
tproxy-port: 5001
ipv6: true
mode: rule
unified-delay: true
tcp-concurrent: true
disable-keep-alive: false
keep-alive-idle: 600
keep-alive-interval: 15
find-process-mode: off
geodata-mode: false
geo-auto-update: false
global-client-fingerprint: chrome
external-controller: 0.0.0.0:9090
external-ui: ui
external-ui-url: "https://github.com/MetaCubeX/metacubexd/releases/latest/download/compressed-dist.tgz"
profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]

anchors:
  a1: &domain { type: http, format: mrs, behavior: domain, interval: 86400 }
  a2: &ipcidr { type: http, format: mrs, behavior: ipcidr, interval: 86400 }
  a3: &classical { type: http, format: text, behavior: classical, interval: 86400 }
  a4: &inline { type: inline, behavior: classical }

dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: true
  cache-algorithm: arc
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "+.local"
    - "+.stun.*.*"
    - "+.stun.*.*.*"
    - "+.stun.*.*.*.*"
    - "*.msftconnecttest.com"
    - "*.msftncsi.com"
    - "+.srv.nintendo.net"
    - "+.stun.playstation.net"
    - "+.xboxlive.com"
    - "+.pool.ntp.org"
    - "localhost.ptlogin2.qq.com"
  default-nameserver:
    - 8.8.8.8
    - 1.1.1.1
  proxy-server-nameserver:
    - https://8.8.8.8/dns-query
    - https://1.1.1.1/dns-query
  nameserver:
    - https://dns.petqa.ru/dns-query

proxy-providers:
  pqsubscribe:
    type: http
    url: https://subqqeerr.petqa.ru/secret
    interval: 3600
    proxy: DIRECT
    health-check:
      enable: true
      url: http://cp.cloudflare.com/generate_204
      expected-status: 204
      interval: 120
      timeout: 3000
      lazy: false

### ═══════════════════════════════════════════════
###  PROXY GROUPS
###
###  Структура:
###    PROXY (select) ──► BALANCE ──► прокси + DIRECT (fallback при баге)
###                   ──► BEST    ──► прокси + DIRECT (fallback при баге)
###                   ──► MANUAL  ──► ручной выбор
###                   ──► DIRECT
###
###  QUIC (hidden) ──► REJECT (блокировка UDP/443 по умолчанию)
###                ──► PASS
###
###  Защита от бага "все серверы мертвы":
###    BALANCE и BEST включают DIRECT в конце списка.
###    Если mihomo ошибочно считает все прокси мёртвыми,
###    трафик пойдёт напрямую, а не в чёрную дыру.
### ═══════════════════════════════════════════════

proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - BALANCE
      - BEST
      - MANUAL
      - DIRECT

  - name: BALANCE
    type: load-balance
    use:
      - pqsubscribe
    proxies:
      - DIRECT
    strategy: consistent-hashing
    url: http://cp.cloudflare.com/generate_204
    expected-status: 204
    interval: 120
    timeout: 3000
    tolerance: 200
    lazy: false

  - name: BEST
    type: url-test
    use:
      - pqsubscribe
    proxies:
      - DIRECT
    url: http://cp.cloudflare.com/generate_204
    expected-status: 204
    interval: 120
    timeout: 3000
    tolerance: 200
    lazy: false

  - name: MANUAL
    type: select
    use:
      - pqsubscribe

  - name: QUIC
    type: select
    hidden: true
    proxies:
      - REJECT
      - PASS

### ═══════════════════════════════════════════════
###  RULE PROVIDERS
###
###  Источники:
###    MetaCubeX/meta-rules-dat — основной репозиторий geosite/geoip
