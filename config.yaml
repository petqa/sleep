### ═══════════════════════════════════════════════
###  RULES
###
###  Порядок (приоритет сверху вниз):
###    1. QUIC блокировка (UDP/443)
###    2. Приватные сети → DIRECT
###    3. Свои домены → DIRECT (petqa.ru, huuli.art — избежать петли)
###    4. Сервисы → PROXY (AI, стриминг, соцсети)
###    5. CDN/Cloud → PROXY (IP-диапазоны хостеров)
###    6. RU-фильтры → PROXY
###    7. Пользовательские → PROXY
###    8. MATCH → DIRECT (всё остальное напрямую)
### ═══════════════════════════════════════════════

rules:
  # ── QUIC блокировка ──
  - AND,((NETWORK,UDP),(DST-PORT,443)),QUIC

  # ── Приватные сети → DIRECT ──
  - OR,((RULE-SET,geosite-private),(RULE-SET,geoip-private,no-resolve)),DIRECT

  # ── Свои домены → DIRECT (предотвращение петли) ──
  - DOMAIN-KEYWORD,petqa.ru,DIRECT
  - DOMAIN-KEYWORD,huuli.art,DIRECT
  - DOMAIN-KEYWORD,cp.cloudflare.com,DIRECT

  # ── Сервисы → PROXY ──
  - RULE-SET,category-ai@domain,PROXY
  - RULE-SET,steam@domain,PROXY
  - RULE-SET,spotify@domain,PROXY
  - RULE-SET,reddit@domain,PROXY
  - RULE-SET,youtube@domain,PROXY
  - RULE-SET,twitch@domain,PROXY
  - RULE-SET,twitter@domain,PROXY
  - RULE-SET,discord@classical,PROXY
  - OR,((RULE-SET,meta@domain),(RULE-SET,meta@ipcidr,no-resolve)),PROXY
  - OR,((RULE-SET,telegram@domain),(RULE-SET,telegram@ipcidr,no-resolve)),PROXY

  # ── CDN / Cloud → PROXY ──
  - OR,((RULE-SET,cloudflare@domain),(RULE-SET,cloudflare@ipcidr,no-resolve)),PROXY
  - OR,((RULE-SET,amazon@domain),(RULE-SET,amazon@ipcidr,no-resolve)),PROXY
  - OR,((RULE-SET,akamai@domain),(RULE-SET,akamai@ipcidr,no-resolve)),PROXY
  - OR,((RULE-SET,digitalocean@domain),(RULE-SET,digitalocean@ipcidr,no-resolve)),PROXY
  - OR,((RULE-SET,fastly@domain),(RULE-SET,fastly@ipcidr,no-resolve)),PROXY
  - OR,((RULE-SET,hetzner@domain),(RULE-SET,hetzner@ipcidr,no-resolve)),PROXY
  - OR,((RULE-SET,oracle@domain),(RULE-SET,oracle@ipcidr,no-resolve)),PROXY
  - RULE-SET,gcore@ipcidr,PROXY
  - RULE-SET,cdn77@ipcidr,PROXY
  - RULE-SET,vultr@ipcidr,PROXY
  - RULE-SET,scaleway@ipcidr,PROXY
  - RULE-SET,ovh@ipcidr,PROXY

  # ── RU-фильтры → PROXY ──
  - RULE-SET,refilter@domain,PROXY
  - RULE-SET,rubundle@domain,PROXY
  - RULE-SET,legizdiscord@ipcidr,PROXY

  # ── Пользовательские → PROXY ──
  - RULE-SET,user@classical,PROXY

  # ── Google/GitHub ──
  - RULE-SET,google@domain,PROXY
  - RULE-SET,github@domain,PROXY

  # ── Всё остальное ──
  - MATCH,DIRECT
